<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双三角画布 · 一堂 AI FDE 工作坊</title>
<style>
:root{--bg:#0a0d16;--panel:#131828;--panel2:#1a2138;--line:#2a3352;--txt:#e6e9f2;--dim:#8b93ab;--purple:#a78bfa;--cyan:#22d3ee;--gold:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;min-height:100vh}
.nav{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,13,22,.92);backdrop-filter:blur(6px);z-index:9}
.nav a{color:var(--cyan);text-decoration:none;font-size:14px}
.nav h1{font-size:18px;color:var(--gold);letter-spacing:1px}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.intro{color:var(--dim);font-size:14px;margin-bottom:24px}
.tri-row{display:grid;grid-template-columns:1fr 150px 1fr;gap:16px;align-items:stretch}
@media(max-width:900px){.tri-row{grid-template-columns:1fr}.mid{flex-direction:row}}
.tri{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.tri h2{font-size:16px;margin-bottom:4px}
.tri .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.tri.left h2{color:var(--purple)}
.tri.right h2{color:var(--cyan)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.card .tag{font-size:11px;color:var(--dim);margin-left:6px;font-weight:400}
.card textarea{width:100%;min-height:64px;background:#0e1424;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:13px;resize:vertical;font-family:inherit}
.card textarea:focus{outline:none;border-color:var(--purple)}
.slider-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.slider-row span{font-size:12px;color:var(--dim);white-space:nowrap}
.slider-row output{font-size:13px;font-weight:700;width:20px;text-align:center}
.tri.left output{color:var(--purple)}
.tri.right output{color:var(--cyan)}
input[type=range]{flex:1;accent-color:var(--gold)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.mid .arrow{color:var(--gold);font-size:22px}
.mid .box{background:linear-gradient(135deg,rgba(167,139,250,.15),rgba(34,211,238,.15));border:1px solid var(--gold);border-radius:12px;padding:12px 10px;text-align:center}
.mid .box b{color:var(--gold);font-size:14px;display:block}
.mid .box small{color:var(--dim);font-size:11px}
.action{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:20px;margin-top:20px}
.action h2{color:var(--gold);font-size:17px;margin-bottom:4px}
.action .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input[type=text],.field textarea{width:100%;background:#0e1424;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:13px;font-family:inherit}
.field textarea{min-height:56px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.checks{display:flex;flex-wrap:wrap;gap:10px}
.checks label{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.checks input{accent-color:var(--gold)}
.btns{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
button{border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
button:hover{opacity:.88}
.btn-gold{background:var(--gold);color:#0a0d16}
.btn-purple{background:var(--purple);color:#0a0d16}
.btn-cyan{background:var(--cyan);color:#0a0d16}
.out{margin-top:18px;display:none}
.out pre{background:#0e1424;border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-word;font-size:12px;color:#c9d1e9;max-height:400px;overflow:auto;font-family:ui-monospace,monospace}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#0a0d16;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
footer{text-align:center;color:var(--dim);font-size:12px;padding:24px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<nav class="nav">
<a href="/fde/">← 工作坊主页</a>
<h1>双三角画布</h1>
</nav>
<div class="wrap">
<p class="intro">人的三要素与 AI 三要素互补整合：左边写「你」的底子，右边写「AI 能补什么」，底部把两者落到一个最小场景×最小 Feature 上。</p>
<div class="tri-row">
<div class="tri left">
<h2>人的三要素</h2>
<p class="sub">你带着什么进场</p>
<div class="card">
<label>审美<span class="tag">判断好坏的品味</span></label>
<textarea data-k="h_shenmei" placeholder="你一眼能看出好坏的事是什么？什么样的结果你会立刻打回？"></textarea>
<div class="slider-row"><span>自评</span><input type="range" min="1" max="5" value="3" data-r="h_shenmei"><output>3</output></div>
</div>
<div class="card">
<label>体系<span class="tag">结构与方法的积累</span></label>
<textarea data-k="h_tixi" placeholder="你在自己的领域里沉淀过什么框架、流程或方法论？"></textarea>
<div class="slider-row"><span>自评</span><input type="range" min="1" max="5" value="3" data-r="h_tixi"><output>3</output></div>
</div>
<div class="card">
<label>数据<span class="tag">对业务数据的熟悉</span></label>
<textarea data-k="h_shuju" placeholder="你手上有哪些别人拿不到的业务数据或一线信息？"></textarea>
<div class="slider-row"><span>自评</span><input type="range" min="1" max="5" value="3" data-r="h_shuju"><output>3</output></div>
</div>
</div>
<div class="mid">
<div class="box"><b>互补整合</b><small>人的底子 × AI 的杠杆</small></div>
<div class="arrow">⇄</div>
</div>
<div class="tri right">
<h2>AI 三要素</h2>
<p class="sub">AI 补什么</p>
<div class="card">
<label>补场景<span class="tag">AI 能落地的环节</span></label>
<textarea data-k="a_changjing" placeholder="你的流程里，哪个环节 AI 一上来就能帮忙？"></textarea>
<div class="slider-row"><span>自评</span><input type="range" min="1" max="5" value="3" data-r="a_changjing"><output>3</output></div>
</div>
<div class="card">
<label>补工程闭环<span class="tag">从 demo 到可用</span></label>
<textarea data-k="a_gongcheng" placeholder="怎么把 AI 输出接进你现有的工作流，形成闭环而不是一次性演示？"></textarea>
<div class="slider-row"><span>自评</span><input type="range" min="1" max="5" value="3" data-r="a_gongcheng"><output>3</output></div>
</div>
<div class="card">
<label>补真实反馈数据<span class="tag">让 AI 越用越准</span></label>
<textarea data-k="a_fankui" placeholder="你能持续提供哪些真实反馈，让 AI 的输出不断校准？"></textarea>
<div class="slider-row"><span>自评</span><input type="range" min="1" max="5" value="3" data-r="a_fankui"><output>3</output></div>
</div>
</div>
</div>
<div class="action">
<h2>最小场景 × 最小 Feature</h2>
<p class="sub">把画布收敛成一个可以一周内交付的起点</p>
<div class="field">
<label>场景名</label>
<input type="text" data-k="s_name" placeholder="例：周报初稿自动汇总">
</div>
<div class="field">
<label>选场景四判据（至少满足两项再动手）</label>
<div class="checks">
<label><input type="checkbox" data-k="c_rule">规则明确</label>
<label><input type="checkbox" data-k="c_repeat">重复性高</label>
<label><input type="checkbox" data-k="c_time">消耗时间多</label>
<label><input type="checkbox" data-k="c_safe">错了不致命</label>
</div>
</div>
<div class="field">
<label>最小 Feature 一句话</label>
<input type="text" data-k="s_feature" placeholder="例：把 5 份周报粘进输入框，输出一份结构化汇总初稿">
</div>
<div class="field">
<label>验收标准（60 分 = 愿意拿去用）</label>
<textarea data-k="s_accept" placeholder="例：汇总初稿我只需要改 3 处以内就敢发出去"></textarea>
</div>
<div class="btns">
<button class="btn-gold" id="btnPrompt">转提示词</button>
<button class="btn-purple" id="btnMd">导出 Markdown</button>
<button class="btn-cyan" id="btnClear">清空画布</button>
</div>
<div class="out" id="outWrap">
<pre id="outPre"></pre>
<div class="btns"><button class="btn-gold" id="btnCopy">复制内容</button></div>
</div>
</div>
</div>
<footer>一堂·AI FDE 工作坊 · yitang.aibay.asia</footer>
<div class="toast" id="toast"></div>
<script>
(function(){
var KEY='yitang_canvas';
var FIELDS=['h_shenmei','h_tixi','h_shuju','a_changjing','a_gongcheng','a_fankui','s_name','s_feature','s_accept'];
var CHECKS=['c_rule','c_repeat','c_time','c_safe'];
var NAMES={h_shenmei:'审美（人）',h_tixi:'体系（人）',h_shuju:'数据（人）',a_changjing:'补场景（AI）',a_gongcheng:'补工程闭环（AI）',a_fankui:'补真实反馈数据（AI）',s_name:'场景名',s_feature:'最小 Feature',s_accept:'验收标准'};
var LEVELS={1:'很弱',2:'较弱',3:'一般',4:'较强',5:'很强'};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){var d={};document.querySelectorAll('[data-k]').forEach(function(el){d[el.dataset.k]=el.type==='checkbox'?el.checked:el.value});document.querySelectorAll('[data-r]').forEach(function(el){d[el.dataset.r+'_r']=el.value});localStorage.setItem(KEY,JSON.stringify(d))}
function init(){var d=load();FIELDS.concat(CHECKS).forEach(function(k){var el=document.querySelector('[data-k="'+k+'"]');if(el&&d[k]!==undefined){if(el.type==='checkbox')el.checked=d[k];else el.value=d[k]}});document.querySelectorAll('[data-r]').forEach(function(el){var v=d[el.dataset.r+'_r'];if(v){el.value=v}el.nextElementSibling.textContent=el.value})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}
document.addEventListener('input',function(e){if(e.target.matches('[data-r]')){e.target.nextElementSibling.textContent=e.target.value+' '+LEVELS[e.target.value]}save()});
document.addEventListener('change',function(e){if(e.target.matches('[data-k],[data-r]'))save()});
function gather(){var d=load(),r={texts:{},ratings:{},checks:[]};FIELDS.forEach(function(k){r.texts[k]=d[k]||''});document.querySelectorAll('[data-r]').forEach(function(el){r.ratings[el.dataset.r]=parseInt(el.value,10)});CHECKS.forEach(function(k){if(d[k])r.checks.push({c_rule:'规则明确',c_repeat:'重复性高',c_time:'消耗时间多',c_safe:'错了不致命'}[k])});return r}
function buildPrompt(){var r=gather(),L=[];
L.push('你是一名 AI 应用落地教练。以下是我用「双三角画布」完成的自查，请基于它帮我打磨最小场景落地方案。');
L.push('');
L.push('## 人的三要素');
[['h_shenmei','审美'],['h_tixi','体系'],['h_shuju','数据']].forEach(function(p){L.push('- '+p[1]+'（自评 '+r.ratings[p[0]]+'/5）：'+(r.texts[p[0]]||'（未填）'))});
L.push('');
L.push('## AI 三要素（AI 补什么）');
[['a_changjing','补场景'],['a_gongcheng','补工程闭环'],['a_fankui','补真实反馈数据']].forEach(function(p){L.push('- '+p[1]+'（自评 '+r.ratings[p[0]]+'/5）：'+(r.texts[p[0]]||'（未填）'))});
L.push('');
L.push('## 最小场景 × 最小 Feature');
L.push('- 场景名：'+(r.texts.s_name||'（未填）'));
L.push('- 四判据命中：'+(r.checks.length?r.checks.join('、'):'（未勾选）'));
L.push('- 最小 Feature：'+(r.texts.s_feature||'（未填）'));
L.push('- 验收标准（60 分）：'+(r.texts.s_accept||'（未填）'));
L.push('');
L.push('请：1) 指出画布中人的强项与 AI 补位是否匹配；2) 若四判据命中不足两项，给出更合适的场景建议；3) 把最小 Feature 细化为三步以内的执行计划。');
return L.join('\n')}
function buildMd(){var r=gather(),L=[];
L.push('# 双三角画布');
L.push('');
L.push('## 人的三要素');
[['h_shenmei','审美'],['h_tixi','体系'],['h_shuju','数据']].forEach(function(p){L.push('### '+p[1]+'（自评 '+r.ratings[p[0]]+'/5）');L.push((r.texts[p[0]]||'（未填）'));L.push('')});
L.push('## AI 三要素（AI 补什么）');
[['a_changjing','补场景'],['a_gongcheng','补工程闭环'],['a_fankui','补真实反馈数据']].forEach(function(p){L.push('### '+p[1]+'（自评 '+r.ratings[p[0]]+'/5）');L.push((r.texts[p[0]]||'（未填）'));L.push('')});
L.push('## 最小场景 × 最小 Feature');
L.push('- 场景名：'+(r.texts.s_name||'（未填）'));
L.push('- 四判据命中：'+(r.checks.length?r.checks.join('、'):'（未勾选）'));
L.push('- 最小 Feature：'+(r.texts.s_feature||'（未填）'));
L.push('- 验收标准（60 分）：'+(r.texts.s_accept||'（未填）'));
L.push('');
L.push('---');
L.push('');
L.push('```');
L.push(buildPrompt());
L.push('```');
return L.join('\n')}
function show(txt){document.getElementById('outPre').textContent=txt;document.getElementById('outWrap').style.display='block'}
document.getElementById('btnPrompt').onclick=function(){show(buildPrompt());toast('提示词已生成')};
document.getElementById('btnCopy').onclick=function(){var t=document.getElementById('outPre').textContent;if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast('已复制到剪贴板')},function(){toast('复制失败，请手动选择复制')})}else{toast('当前环境不支持自动复制')}};
document.getElementById('btnMd').onclick=function(){var b=new Blob([buildMd()],{type:'text/markdown;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='yitang_canvas.md';a.click();URL.revokeObjectURL(a.href);toast('Markdown 已导出')};
document.getElementById('btnClear').onclick=function(){if(!confirm('确定清空画布全部内容？'))return;localStorage.removeItem(KEY);document.querySelectorAll('[data-k]').forEach(function(el){if(el.type==='checkbox')el.checked=false;else el.value=''});document.querySelectorAll('[data-r]').forEach(function(el){el.value=3;el.nextElementSibling.textContent='3 一般'});document.getElementById('outWrap').style.display='none';toast('画布已清空')};
init();
})();
</script>
</body>
</html>
